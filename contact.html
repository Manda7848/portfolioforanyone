<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Gemini Glaze</title>
    <link rel="icon" href="https://www.gstatic.com/lamda/images/favicon_v1_150160c13ff28654b4d3.svg" type="image/svg+xml">
    <link rel="shortcut icon" href="https://www.gstatic.com/lamda/images/favicon_v1_150160c13ff28654b4d3.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-form {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        .input-group {
            margin-bottom: 2rem;
        }
        input, textarea {
            width: 100%;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1.4rem;
            transition: 0.3s;
        }
        input:focus, textarea:focus {
            border-color: var(--main-color);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">GEMINI</div>
        <div class="status-indicator"><div class="status-dot"></div> Gemini v3 Flash: ONLINE</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="showcase.html">Showcase</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section style="justify-content: center;">
        <div class="glass-card contact-form">
            <h2 style="font-family:'Orbitron'; margin-bottom: 2rem; font-size: 3.5rem;">Initiate <span>Contact</span></h2>
            <form action="#">
                <div class="input-group">
                    <input type="text" placeholder="Identity / Name" required>
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Communication Sync / Email" required>
                </div>
                <div class="input-group">
                    <textarea rows="5" placeholder="Transmission Data / Message" required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Transmit</button>
            </form>

            <div style="margin-top: 4rem; padding-top: 2.5rem; border-top: 1px solid var(--glass-border);">
                <p style="margin-bottom: 2rem; font-size: 1.2rem; color: #ccc; letter-spacing: 1px;">DIRECT ACCESS</p>
                <a href="https://gemini.google.com" target="_blank" class="btn" style="background: transparent; border: 1px solid var(--secondary-color); color: var(--secondary-color);">Launch Official Interface</a>
            </div>
        </div>
    </section>

    <footer>courtesy of Manda7848 | &copy; 2026 Gemini Glaze</footer>
    <script src="script.js"></script>
</body>
</html>
