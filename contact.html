<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Gemini Glaze</title>
    <link rel="icon" type="image/svg+xml" href="https://www.gstatic.com/lamda/images/favicon_v1_150160c13ff28654b4d3.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group { margin-bottom: 2rem; }
        input, textarea {
            width: 100%;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-size: 1.4rem;
        }
        input:focus { border-color: var(--main-color); }
    </style>
</head>
<body>
    <header>
        <div class="logo">GEMINI</div>
        <div class="status-indicator"><div class="status-dot"></div> Gemini v3 Flash: ONLINE</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="showcase.html">Showcase</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section style="justify-content: center;">
        <div class="glass-card" style="max-width: 600px; width: 100%; text-align: center;">
            <h2 style="margin-bottom: 2rem;">Join the <span>Mission</span></h2>
            <p style="margin-bottom: 3rem; color: #ccc;">Have a project? Launch your inquiry into the Glaze.</p>
            
            <form>
                <div class="form-group"><input type="text" placeholder="Identity/Name"></div>
                <div class="form-group"><input type="email" placeholder="Communication/Email"></div>
                <div class="form-group"><textarea rows="4" placeholder="Your Message"></textarea></div>
                <button type="submit" class="btn" style="width: 100%;">Transmit Data</button>
            </form>

            <div style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                <p style="margin-bottom: 2rem; font-size: 1.2rem;">OFFICIAL CHANNELS</p>
                <a href="https://gemini.google.com" target="_blank" class="btn" style="background: transparent; border: 1px solid var(--secondary-color); color: var(--secondary-color);">Launch Official Gemini</a>
            </div>
        </div>
    </section>

    <footer>courtesy of manda7848 | &copy; 2026 Gemini Glaze</footer>
    <script src="script.js"></script>
</body>
</html>
