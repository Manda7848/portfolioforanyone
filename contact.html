<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Gemini Glaze</title>
    <link rel="icon" href="https://www.gstatic.com/lamda/images/favicon_v1_150160c13ff28654b4d3.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">GEMINI</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="showcase.html">Showcase</a>
            <a href="services.html">Services</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section style="justify-content: center;">
        <div class="glass-card" style="max-width: 650px; width:100%; text-align: center;">
            <h2 style="font-family:'Orbitron'; margin-bottom: 2rem;">Initiate <span>Contact</span></h2>
            <form>
                <input type="text" placeholder="Identity" style="width:100%; padding:1.5rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white; margin-bottom:2rem; border-radius:8px;">
                <input type="email" placeholder="Communication Sync" style="width:100%; padding:1.5rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white; margin-bottom:2rem; border-radius:8px;">
                <textarea rows="4" placeholder="Transmission Data" style="width:100%; padding:1.5rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:white; margin-bottom:2rem; border-radius:8px;"></textarea>
                <button type="submit" class="btn" style="width:100%;">Transmit</button>
            </form>
            <div style="margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                <a href="https://gemini.google.com" target="_blank" class="btn" style="background:transparent; border:1px solid var(--secondary-color); color:var(--secondary-color);">Launch Official Interface</a>
            </div>
        </div>
    </section>

    <footer>courtesy of Manda7848 | &copy; 2026 Gemini Glaze</footer>
    <script src="script.js"></script>

</html>
